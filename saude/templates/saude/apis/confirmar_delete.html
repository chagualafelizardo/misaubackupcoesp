{% extends "saude/base.html" %}

{% block title %}Confirmar Exclusão - MISAU{% endblock %}

{% block body %}
<div style="max-width:500px; margin:40px auto; background:white; padding:32px; border-radius:16px; box-shadow:0 4px 6px rgba(0,0,0,0.1); text-align:center;">
    <h3>Confirmar Exclusão</h3>
    <p>Tem certeza que deseja excluir a configuração <strong>"{{ config.nome }}"</strong>?</p>
    <form method="post" style="margin-top:20px;">
        {% csrf_token %}
        <button type="submit" class="btn" style="background:#b91c1c; color:white;">Sim, excluir</button>
        <a href="{% url 'listar_apis' %}" class="btn btn-outline">Cancelar</a>
    </form>
</div>
{% endblock %}
