{% extends "saude/base.html" %}

{% block title %}Confirmar Exclusão - COESP{% endblock %}

{% block content %}
<div class="container">
    <h2>⚠️ Confirmar Exclusão</h2>
    <p>Tem certeza que deseja excluir a configuração <strong>"{{ config.nome }}"</strong>?</p>
    <p style="color:var(--text-secondary);">Esta ação não pode ser desfeita.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, excluir</button>
        <a href="{% url 'listar_apis' %}" class="btn btn-outline">Cancelar</a>
    </form>
</div>
{% endblock %}
