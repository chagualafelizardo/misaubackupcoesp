{% extends "saude/base.html" %}

{% block title %}{{ acao }} Configuração de API - MISAU{% endblock %}

{% block body %}
<div style="max-width:600px; margin:40px auto; background:white; padding:32px; border-radius:16px; box-shadow:0 4px 6px rgba(0,0,0,0.1);">
    <h2>{{ acao }} Configuração de API</h2>
    <form method="post" style="margin-top:20px;">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display:flex; gap:12px; margin-top:20px;">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{% url 'listar_apis' %}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
