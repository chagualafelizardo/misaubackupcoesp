<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MISAU</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f4f7f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            color: #1a5d3c;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }
        .login-container p.sub {
            color: #2d3e42;
            margin-bottom: 24px;
        }
        .login-container form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .login-container input {
            padding: 12px 16px;
            border: 1px solid #cbd5c1;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }
        .login-container input:focus {
            outline: 2px solid #1a5d3c;
            border-color: transparent;
        }
        .login-container button {
            background: #1a5d3c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-container button:hover { background: #0e3b25; }
        .login-container .error {
            color: #b91c1c;
            font-size: 0.9rem;
            margin-top: -8px;
        }
        .login-container .links {
            margin-top: 16px;
            text-align: center;
            font-size: 0.9rem;
        }
        .login-container .links a {
            color: #1a5d3c;
            text-decoration: none;
        }
        .login-container .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>MISAU</h1>
        <p class="sub">Acesso restrito à equipa de saúde</p>
        <form method="post">
            {% csrf_token %}
            {{ form.username.label_tag }}
            {{ form.username }}
            {{ form.password.label_tag }}
            {{ form.password }}
            {% if form.errors %}
                <div class="error">Usuário ou senha inválidos.</div>
            {% endif %}
            <button type="submit">Entrar</button>
        </form>
        <div class="links">
            <a href="{% url 'dashboard' %}">← Voltar ao painel público</a>
        </div>
    </div>
</body>
</html>
